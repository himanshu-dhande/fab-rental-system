{% extends 'base.html' %}
{% block title %}Add Cloth — Fab Rental{% endblock %}

{% block extra_css %}
<style>
.form-page { max-width:760px; margin:60px auto; padding:0 24px 80px; }
.form-page h1 { font-family:'Cormorant Garamond',serif; font-size:40px; font-weight:700; color:#1a1a1a; margin-bottom:8px; }
.form-page .sub { font-size:13px; color:#888; margin-bottom:40px; }
.form-card { background:#fff; border:1px solid #ede8e1; padding:40px; }
.form-row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.form-group { margin-bottom:22px; }
.form-group label { display:block; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#555; font-weight:600; margin-bottom:8px; }
.form-group input,
.form-group select,
.form-group textarea { width:100%; padding:12px 14px; border:1px solid #e0dbd4; font-size:13px; font-family:'Montserrat',sans-serif; color:#333; outline:none; transition:border .3s; background:#fff; }
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus { border-color:#c9a84c; }
.form-group textarea { resize:vertical; min-height:90px; }
.form-divider { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:#aaa; text-align:center; margin:10px 0; padding:10px 0; border-top:1px dashed #eee; border-bottom:1px dashed #eee; }
.btn-submit { width:100%; padding:16px; background:#1a1a1a; color:#fff; font-size:12px; font-weight:600; letter-spacing:2.5px; text-transform:uppercase; border:none; cursor:pointer; margin-top:10px; transition:background .3s; }
.btn-submit:hover { background:#e6b84a; color:#1a1a1a; }
.back-link { text-align:center; margin-top:16px; font-size:12px; color:#888; }
.back-link a { color:#1a1a1a; font-weight:500; }

/* Image preview */
.img-preview { width:100%; height:200px; object-fit:cover; margin-top:12px; border:1px solid #e0dbd4; display:none; }
</style>
{% endblock %}

{% block content %}
<div class="form-page">
  <h1>Add New Cloth</h1>
  <p class="sub">Fill in the details to add a new item to the collection.</p>

  <div class="form-card">
    <form method="POST" action="{{ url_for('add_cloth') }}" enctype="multipart/form-data">

      <div class="form-row">
        <div class="form-group">
          <label>Title *</label>
          <input type="text" name="title" placeholder="e.g. Bridal Red Lehenga Choli" required/>
        </div>
        <div class="form-group">
          <label>Category *</label>
          <select name="category" required>
            <option value="">Select Category</option>
            <option value="Women">Women</option>
            <option value="Men">Men</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Type</label>
          <select name="cloth_type">
            <option value="">Select Type</option>
            <optgroup label="Women">
              <option>Saree</option>
              <option>Lehenga</option>
              <option>Anarkali</option>
              <option>Gown</option>
              <option>Salwar Suit</option>
            </optgroup>
            <optgroup label="Men">
              <option>Sherwani</option>
              <option>Bandhgala</option>
              <option>Kurta</option>
              <option>Indo-Western</option>
            </optgroup>
          </select>
        </div>
        <div class="form-group">
          <label>Size *</label>
          <select name="size" required>
            <option value="">Select Size</option>
            <option>XS</option><option>S</option><option>M</option>
            <option>L</option><option>XL</option><option>XXL</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Price Per Day (₹) *</label>
          <input type="number" name="price" min="1" step="0.01" placeholder="e.g. 2500" required/>
        </div>
        <div class="form-group">
          <label>Occasion</label>
          <select name="occasion">
            <option value="Wedding">Wedding</option>
            <option value="Sangeet">Sangeet</option>
            <option value="Cocktail">Cocktail</option>
            <option value="Haldi">Haldi</option>
            <option value="Reception">Reception</option>
            <option value="Party">Party</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea name="description" placeholder="Describe the cloth, fabric, embroidery, etc."></textarea>
      </div>

      <div class="form-divider">Image — Upload File OR Paste URL</div>

      <div class="form-group">
        <label>Upload Image File</label>
        <input type="file" name="image_file" accept="image/*" onchange="previewImg(this)"/>
        <img id="imgPreview" class="img-preview" alt="Preview"/>
      </div>

      <div class="form-group">
        <label>Or Paste Image URL</label>
        <input type="url" name="image_url" placeholder="https://example.com/image.jpg"
               oninput="previewUrl(this.value)"/>
      </div>

      <button type="submit" class="btn-submit">Add to Collection →</button>
    </form>
  </div>
  <p class="back-link"><a href="{{ url_for('admin_panel') }}">← Back to Admin</a></p>
</div>

<script>
function previewImg(input) {
  const prev = document.getElementById('imgPreview');
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => { prev.src = e.target.result; prev.style.display = 'block'; };
    reader.readAsDataURL(input.files[0]);
  }
}
function previewUrl(url) {
  const prev = document.getElementById('imgPreview');
  if (url) { prev.src = url; prev.style.display = 'block'; }
  else { prev.style.display = 'none'; }
}
</script>
{% endblock %}
